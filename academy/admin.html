<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Admin · Creator Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;1,400&family=Libre+Caslon+Display&family=Libre+Caslon+Text:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/base.css" />
  <link rel="stylesheet" href="/assets/menu.css" />
  <link rel="stylesheet" href="/assets/pages.css" />
  <link rel="stylesheet" href="/assets/academy.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <nav class="nav-fixed">
    <div class="nav-inner">
      <span class="nav-logo">Camila Zenu</span>
      <div class="nav-right">
        <a class="nav-link" href="/creator-academy">Creator Academy</a>
      </div>
    </div>
  </nav>
  <main class="ac-wrap">
    <div class="ac-head">
      <h1>Camila’s <em>tools</em></h1>
      <div class="who"><a href="/academy/">Back to the Academy</a></div>
    </div>
    <div id="msg" class="notice" hidden></div>
    <div id="app"><p class="loading">Loading…</p></div>
  </main>

  <footer>
    <p>Camila Zenu &middot; <a href="/links">Products I Love</a> &middot; <a href="mailto:camila@camilazenu.com">camila@camilazenu.com</a></p>
    <p style="margin-top:.4rem;">&copy; 2026 Camila Zenu. All rights reserved.</p>
  </footer>
  <script src="/assets/menu.js"></script>
  <script type="module">
    import { api, esc, fmtDate, notice, busy } from '/assets/academy-client.js';
    import { Upload } from '/assets/vendor/tus.js';

    const app = document.getElementById('app');
    const msg = document.getElementById('msg');
    const ok = (t) => { notice(msg, t, 'ok'); scrollTo({ top: 0, behavior: 'smooth' }); };
    const fail = (e) => { notice(msg, e.message || String(e), 'error'); scrollTo({ top: 0, behavior: 'smooth' }); };
    const today = () => new Date().toLocaleDateString('en-CA');
    const statusPill = (r) => `<span class="pill ${r.member ? 'on' : r.status === 'past_due' ? 'off' : ''}">${esc(r.member && r.status === 'none' ? 'comp' : r.status)}</span>`;

    let q = '', f = '', D = null;
    const libOptions = (sel) => [['academy', 'Creator Academy members'], ...D.libraries.map((l) => [l.id, l.name])]
      .map(([v, t]) => `<option value="${esc(v)}" ${v === sel ? 'selected' : ''}>${esc(t)}</option>`).join('');
    const audienceOptions = (sel) => [['academy', 'Creator Academy members'], ['cc', 'Creator Consciousness · every round'], ...D.libraries.map((l) => [l.id, `${l.name} only`])]
      .map(([v, t]) => `<option value="${esc(v)}" ${v === sel ? 'selected' : ''}>${esc(t)}</option>`).join('');
    const audienceName = (a) => !a || a === 'academy' ? 'Creator Academy' : a === 'cc' ? 'All CC rounds' : (D.libraries.find((l) => l.id === a)?.short || a);
    const academyCell = (r) => {
      if (r.paid) return `<span class="pill on">Paid · ${esc(r.plan || '')}</span>${r.cancelAtPeriodEnd ? '<br><span class="fine">canceling</span>' : ''}`;
      const sw = `<label class="switch"><input type="checkbox" data-academy="${esc(r.email)}" ${r.compUntil ? 'checked' : ''} /><span></span></label>`;
      const note = r.compUntil ? `<span class="fine">Free through ${esc(fmtDate(r.compUntil, { month: 'short', day: 'numeric', year: 'numeric' }))}</span>`
        : r.status === 'past_due' ? '<span class="pill off">Payment issue</span>' : r.status === 'canceled' ? '<span class="fine">Canceled</span>' : '';
      return `<div class="ac-cell">${sw}${note}</div>`;
    };
    function drawRows() {
      const rows = document.getElementById('rows');
      const needle = q.trim().toLowerCase();
      const list = D.roster
        .filter((r) => !needle || r.email.includes(needle) || (r.name || '').toLowerCase().includes(needle))
        .filter((r) => !f || (f === 'academy' ? r.member : f === 'paid' ? r.paid : f === 'free' ? !!r.compUntil && !r.paid : f === 'noaccount' ? !r.hasAccount : r.libraries.includes(f)))
        .sort((a, b) => (a.name || a.email).localeCompare(b.name || b.email));
      rows.innerHTML = list.length ? list.map((r) => `<tr>
          <td><strong>${esc(r.name || r.email.split('@')[0])}</strong><br><span class="fine">${esc(r.email)}${r.hasAccount ? '' : ' · no account yet'}${r.foundersRsvp ? ' · Founders RSVP' : ''}</span></td>
          <td>${academyCell(r)}</td>
          ${D.libraries.map((l) => `<td class="c"><label class="switch" title="${esc(l.name)}"><input type="checkbox" data-lib="${esc(l.id)}" data-email="${esc(r.email)}" ${r.libraries.includes(l.id) ? 'checked' : ''} /><span></span></label></td>`).join('')}
          <td>${r.paid ? '' : `<button class="linkish" data-remove="${esc(r.email)}">Remove</button>`}</td>
        </tr>`).join('') : `<tr><td colspan="${D.libraries.length + 3}" class="muted">Nobody matches.</td></tr>`;
      const toggle = async (input, body, update) => {
        input.disabled = true;
        try { await api('/api/academy/admin', body); update(); }
        catch (e) { input.checked = !input.checked; fail(e); }
        finally { input.disabled = false; }
      };
      rows.querySelectorAll('[data-lib]').forEach((i) => (i.onchange = () => toggle(i, { action: 'setLibrary', email: i.dataset.email, library: i.dataset.lib, on: i.checked }, () => {
        const r = D.roster.find((x) => x.email === i.dataset.email);
        r.libraries = i.checked ? [...new Set([...r.libraries, i.dataset.lib])] : r.libraries.filter((x) => x !== i.dataset.lib);
      })));
      rows.querySelectorAll('[data-academy]').forEach((i) => (i.onchange = () => toggle(i, { action: 'setAcademy', email: i.dataset.academy, on: i.checked, until: D.alumniUntil }, () => {
        const r = D.roster.find((x) => x.email === i.dataset.academy);
        r.compUntil = i.checked ? D.alumniUntil : null; r.member = r.paid || i.checked; drawRows();
      })));
      rows.querySelectorAll('[data-remove]').forEach((b) => (b.onclick = () => confirm(`Take away all access for ${b.dataset.remove}?`) && busy(b, async () => {
        try { await api('/api/academy/admin', { action: 'removePerson', email: b.dataset.remove }); await render(); } catch (e) { fail(e); }
      })));
    }

    async function render() {
      let d;
      try { d = await api('/api/academy/admin', { action: 'load' }); }
      catch (e) { app.innerHTML = ''; return fail(e.status === 403 ? new Error('This page is for Academy admins.') : e); }
      D = d;
      const s = d.settings;
      const active = d.roster.filter((r) => r.member).length;

      app.innerHTML = `
      <div class="ac-section">
        <h2>Weekly call</h2>
        <form class="card ac-form" id="settings">
          <div class="row">
            <label>Call name <input name="callTitle" value="${esc(s.callTitle || 'Weekly Live Call')}" /></label>
            <label>When it happens <small>Shown to members, e.g. “Tuesdays · 6:00 PM PT”</small><input name="callTime" value="${esc(s.callTime || '')}" /></label>
          </div>
          <div class="row">
            <label>Next call <input type="datetime-local" name="nextCall" value="${esc((s.nextCall || '').slice(0, 16))}" /></label>
            <label>Zoom link for members <input type="url" name="zoomUrl" placeholder="https://zoom.us/j/…" value="${esc(s.zoomUrl || '')}" /></label>
          </div>
          <label>Founders Call Zoom link <small>Shown to everyone who RSVPs (free accounts included)</small><input type="url" name="foundersZoomUrl" placeholder="https://zoom.us/j/…" value="${esc(s.foundersZoomUrl || '')}" /></label>
          <label>Welcome note <small>Optional message at the top of the members page</small><textarea name="welcome">${esc(s.welcome || '')}</textarea></label>
          <button class="btn-primary" type="submit">Save call details</button>
        </form>

        <h2>Post a prompt or resource</h2>
        <form class="card ac-form" id="post">
          <div class="row">
            <label>Type <select name="kind"><option value="prompt">Weekly prompt</option><option value="resource">Resource</option><option value="post">Update from Camila</option></select></label>
            <label>Who sees it <select name="audience">${audienceOptions('academy')}</select></label>
          </div>
          <label>Title <input name="title" required /></label>
          <label>Message <textarea name="body"></textarea></label>
          <button class="btn-primary" type="submit">Publish</button>
        </form>
        ${d.posts.length ? `<div class="card"><div class="kicker">Published</div><table class="ac-table"><tbody>
          ${[...d.posts].sort((a, b) => b.createdAt - a.createdAt).map((p) => `<tr><td>${esc(fmtDate(p.createdAt, { month: 'short', day: 'numeric' }))}</td><td>${esc(p.title)}<br><span class="fine">${p.kind} · ${esc(audienceName(p.audience))} · ${p.comments.length} replies</span></td><td><button class="linkish" data-delpost="${esc(p.id)}">Delete</button></td></tr>`).join('')}
        </tbody></table></div>` : ''}

        <h2>Replays</h2>
        <form class="card ac-form" id="upload">
          <p>Upload the call recording here. It goes straight to your private Cloudflare video library; only logged-in members can watch it.</p>
          <label>Video file <input type="file" name="file" accept="video/*" required /></label>
          <label>Library <small>Who can watch it</small><select name="program">${libOptions('academy')}</select></label>
          <div class="row">
            <label>Title <input name="title" required placeholder="Weekly Call: Finding your voice" /></label>
            <label>Call date <input type="date" name="date" required value="${today()}" /></label>
          </div>
          <label>Notes <small>Optional</small><textarea name="note" style="min-height:70px"></textarea></label>
          <progress id="prog" value="0" max="100" hidden></progress>
          <button class="btn-primary" type="submit">Upload &amp; publish</button>
          <p class="fine">Keep this tab open until it says Published. The video takes a few minutes to finish processing before it plays.</p>
        </form>
        ${d.replays.length ? `<div class="card"><div class="kicker">In the library</div><table class="ac-table"><tbody>
          ${[...d.replays].sort((a, b) => b.date.localeCompare(a.date)).map((r) => `<tr><td>${esc(fmtDate(r.date, { month: 'short', day: 'numeric', year: 'numeric' }))}</td><td>${esc(r.title)}<br><select class="mini" data-movereplay="${esc(r.uid)}">${r.program === 'cc' ? '<option value="cc" selected>Not yet filed</option>' : ''}${libOptions(r.program || 'academy')}</select></td><td><button class="linkish" data-delreplay="${esc(r.uid)}">Unpublish</button></td></tr>`).join('')}
        </tbody></table></div>` : ''}

        <h2 id="access">Who has access <span class="fine">${d.roster.length} people · ${active} in the Academy</span></h2>
        <p class="fine">Switch a library on or off for anyone. Access follows the email, so people you add here see their libraries as soon as they create an account with that email. Nobody is emailed when you add them.</p>
        <div class="card ac-access">
          <div class="ac-access-bar">
            <input type="search" id="q" placeholder="Search name or email" value="${esc(q)}" />
            <select id="f">
              <option value="">Everyone</option>
              <option value="academy" ${f === 'academy' ? 'selected' : ''}>In the Academy</option>
              <option value="paid" ${f === 'paid' ? 'selected' : ''}>Paying</option>
              <option value="free" ${f === 'free' ? 'selected' : ''}>Free until a date</option>
              <option value="noaccount" ${f === 'noaccount' ? 'selected' : ''}>No account yet</option>
              ${d.libraries.map((l) => `<option value="${esc(l.id)}" ${f === l.id ? 'selected' : ''}>${esc(l.short)}</option>`).join('')}
            </select>
          </div>
          <div style="overflow-x:auto"><table class="ac-table ac-roster">
            <thead><tr><th>Person</th><th>Creator Academy</th>${d.libraries.map((l) => `<th class="c">${esc(l.short)}</th>`).join('')}<th></th></tr></thead>
            <tbody id="rows"></tbody>
          </table></div>
        </div>

        <h2>Add a round of people</h2>
        <form class="card ac-form" id="bulk">
          <p>Paste the emails from a Creator Consciousness round. Each person gets that round's library. Nobody is emailed.</p>
          <label>Library <select name="library">${d.libraries.map((l, i) => `<option value="${esc(l.id)}" ${i === d.libraries.length - 1 ? 'selected' : ''}>${esc(l.name)}</option>`).join('')}</select></label>
          <label>Emails <small>One per line, or separated by commas</small><textarea name="emails" style="min-height:110px"></textarea></label>
          <label class="check"><input type="checkbox" name="withAcademy" checked /> Also give them Creator Academy free through ${esc(fmtDate(d.alumniUntil, { month: 'long', day: 'numeric', year: 'numeric' }))}</label>
          <button class="btn-primary" type="submit">Give access</button>
        </form>

        <h2>Libraries</h2>
        <div class="card">
          <p>${d.libraries.map((l) => esc(l.name)).join(' · ')}</p>
          <form class="ac-form" id="newlib" style="margin-top:.8rem">
            <div class="row">
              <label>New library <input name="name" placeholder="Creator Consciousness 5.0" required /></label>
              <label>Short name <small>Shown on the roster and the Leads board</small><input name="short" placeholder="CC 5.0" /></label>
            </div>
            <button class="btn-outline" type="submit">Add library</button>
          </form>
        </div>
      </div>`;

      const form = (id, fn) => (document.getElementById(id).onsubmit = (ev) => { ev.preventDefault(); busy(ev.submitter, () => fn(new FormData(ev.target), ev.target)); });

      form('settings', async (f) => {
        try {
          const nextCall = f.get('nextCall') ? new Date(f.get('nextCall')).toISOString() : '';
          await api('/api/academy/admin', { action: 'saveSettings', ...Object.fromEntries(f), nextCall });
          ok('Call details saved.');
        } catch (e) { fail(e); }
      });
      form('post', async (f) => {
        try { await api('/api/academy/admin', { action: 'addPost', ...Object.fromEntries(f) }); ok(`Published to ${audienceName(f.get('audience'))}.`); await render(); } catch (e) { fail(e); }
      });
      drawRows();
      document.getElementById('q').oninput = (e) => { q = e.target.value; drawRows(); };
      document.getElementById('f').onchange = (e) => { f = e.target.value; drawRows(); };
      form('bulk', async (fd, el) => {
        try {
          const r = await api('/api/academy/admin', { action: 'bulkAccess', library: fd.get('library'), emails: fd.get('emails'), withAcademy: fd.get('withAcademy') === 'on' });
          ok(`${r.added} ${r.added === 1 ? 'person has' : 'people have'} access.`); el.reset(); await render();
        } catch (e) { fail(e); }
      });
      form('newlib', async (fd) => {
        try { await api('/api/academy/admin', { action: 'addLibrary', name: fd.get('name'), short: fd.get('short') }); ok('Library added.'); await render(); } catch (e) { fail(e); }
      });
      form('upload', async (f) => {
        const file = f.get('file');
        const prog = document.getElementById('prog');
        try {
          const { uploadUrl, uid } = await api('/api/academy/admin', { action: 'uploadUrl', size: file.size, name: f.get('title') });
          prog.hidden = false;
          await new Promise((resolve, reject) => {
            const up = new Upload(file, {
              uploadUrl,
              chunkSize: 50 * 1024 * 1024,
              retryDelays: [0, 3000, 5000, 10000, 20000],
              onProgress: (sent, total) => { prog.value = Math.round((sent / total) * 100); },
              onError: reject,
              onSuccess: resolve,
            });
            up.start();
          });
          await api('/api/academy/admin', { action: 'addReplay', uid, title: f.get('title'), date: f.get('date'), note: f.get('note'), program: f.get('program') });
          ok('Published ✦ The replay will be watchable once Cloudflare finishes processing (usually a few minutes).');
          await render();
        } catch (e) { prog.hidden = true; fail(e); }
      });
      app.querySelectorAll('[data-delpost]').forEach((b) => (b.onclick = () => confirm('Delete this post and its replies?') && busy(b, async () => { try { await api('/api/academy/admin', { action: 'deletePost', id: b.dataset.delpost }); await render(); } catch (e) { fail(e); } })));
      app.querySelectorAll('[data-delreplay]').forEach((b) => (b.onclick = () => confirm('Remove this replay from the library? (The video stays in Cloudflare.)') && busy(b, async () => { try { await api('/api/academy/admin', { action: 'removeReplay', uid: b.dataset.delreplay }); await render(); } catch (e) { fail(e); } })));
      app.querySelectorAll('[data-movereplay]').forEach((sel) => (sel.onchange = async () => {
        try { await api('/api/academy/admin', { action: 'moveReplay', uid: sel.dataset.movereplay, program: sel.value }); ok('Moved.'); } catch (e) { fail(e); }
      }));
    }
    await render();

  </script>
</body>
</html>
