name: Plumbing check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  plumbing-check:
    name: Plumbing check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Painting or plumbing?
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/plumbing-check.mjs
